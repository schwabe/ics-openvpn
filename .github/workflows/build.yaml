# The name of our workflow
name: Build
permissions:
  contents: read
on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
          target: [UiOvpn23, SkeletonOvpn2, UiOvpn2, SargoOvpn23]
    name: "Release ${{ matrix.target }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup release signing
        env:
          KEYSTORE_B64: ${{ secrets.LAUNCHER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LAUNCHER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LAUNCHER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LAUNCHER_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.gradle
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.sargo-release.keystore"
            cat > ~/.gradle/gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2048M
          androidKeystorePath=$HOME/.sargo-release.keystore
          androidKeystorePassword=$KEYSTORE_PASSWORD
          androidKeyAlias=$KEY_ALIAS
          androidKeyPassword=$KEY_PASSWORD
          EOF
          else
            echo -e "icsopenvpnDebugSign=true\norg.gradle.jvmargs=-Xmx2048M" > ~/.gradle/gradle.properties
          fi
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build the app
        run: ./gradlew assemble${{ matrix.target }}Release
      - name: Run Unit tests
        run: ./gradlew -PtestBuildType=release test${{ matrix.target }}ReleaseUnitTest

      - name: Archive apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{matrix.target}}-release-apk
          path: main/build/outputs/apk/**/*universal*.apk
